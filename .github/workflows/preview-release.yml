name: Preview Release (SQLite source)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release de preview (ex.: sqlite-preview-1)"
        required: true
        default: "sqlite-preview-1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install OpenSSL via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          echo "OPENSSL_DIR=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_INCLUDE_DIR=$installed\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_LIB_DIR=$installed\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      # Build manual (em vez do tauri-action) pra poder capturar e persistir
      # o log real em caso de falha — o log do Actions redireciona pra blob
      # storage inacessível fora do navegador/gh cli.
      - name: Build Tauri app (bundle MSI)
        id: tauri_build
        continue-on-error: true
        shell: pwsh
        run: |
          npm run tauri build -- --verbose 2>&1 | Tee-Object -FilePath tauri-build-output.log
          exit $LASTEXITCODE

      - name: Publish build log to repo
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          if (Test-Path tauri-build-output.log) { Copy-Item tauri-build-output.log ci-logs/latest-preview-build.log -Force }
          "tauri build outcome: ${{ steps.tauri_build.outcome }}" | Out-File -FilePath ci-logs/latest-preview-summary.txt
          git add ci-logs
          git commit -m "ci: log do preview build [skip ci]" --allow-empty
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail job if build failed
        if: steps.tauri_build.outcome != 'success'
        run: exit 1
        shell: pwsh

      - name: Create GitHub Release and upload MSI
        if: steps.tauri_build.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          gh release create "${{ github.event.inputs.tag }}" $msi.FullName `
            --title "DJ Set Timer — preview SQLite (${{ github.event.inputs.tag }})" `
            --notes "Build de teste da branch feature/sqlite-realtime-source. Nao mesclado na main ainda." `
            --prerelease

name: Preview Release (SQLite source)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release de preview (ex.: sqlite-preview-1)"
        required: true
        default: "sqlite-preview-1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install OpenSSL via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          echo "OPENSSL_DIR=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_INCLUDE_DIR=$installed\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_LIB_DIR=$installed\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      # Redirecionamento nativo (*>), não pipe pra um cmdlet — piping pra
      # Tee-Object quebra a propagacao de $LASTEXITCODE no PowerShell, o que
      # causou um falso-positivo de falha na tentativa anterior.
      - name: Build Tauri app (bundle MSI)
        id: tauri_build
        shell: pwsh
        run: |
          npm run tauri build -- --verbose *> tauri-build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub Release and upload MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          gh release create "${{ github.event.inputs.tag }}" $msi.FullName `
            --title "DJ Set Timer — preview SQLite (${{ github.event.inputs.tag }})" `
            --notes "Build de teste da branch feature/sqlite-realtime-source. Nao mesclado na main ainda." `
            --prerelease

      # Só roda se o build tiver falhado. Usa a Contents API direto (gh api),
      # não git commit/push — isso rodava em paralelo com o build-check.yml
      # (mesma branch, mesma pasta ci-logs/) e um pull --rebase concorrente
      # perdia o arquivo. PUT direto com nome único por run_id não tem essa
      # corrida: é uma escrita atômica num caminho que nenhum outro workflow usa.
      - name: Publish failure log to repo
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path tauri-build-output.log) {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("tauri-build-output.log"))
            $path = "ci-logs/preview-failure-${{ github.run_id }}.log"
            $json = @{ message = "ci: log de falha $path [skip ci]"; content = $content; branch = "${{ github.ref_name }}" } | ConvertTo-Json
            $json | Out-File -FilePath body.json -Encoding utf8
            gh api --method PUT "repos/${{ github.repository }}/contents/$path" --input body.json
          }

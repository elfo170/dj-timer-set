[package]
name = "dj-set-timer"
version = "0.1.0"
description = "Calculadora de tempo efetivo de sets a partir da biblioteca do Rekordbox"
edition = "2021"

[lib]
name = "dj_set_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled-sqlcipher: compila o SQLCipher a partir do fonte e linka estaticamente.
# Não usamos "vendored-openssl" pois é conhecido por ser instável no Windows;
# em vez disso, o workflow de CI instala o OpenSSL via choco e aponta OPENSSL_DIR.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

[profile.release]
strip = true
lto = true

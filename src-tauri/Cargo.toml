[package]
name = "dj-set-timer"
version = "0.1.0"
description = "Calculadora de tempo efetivo de sets a partir da biblioteca do Rekordbox"
edition = "2021"

[lib]
name = "dj_set_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
